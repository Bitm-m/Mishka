mixed-port: 7890
tproxy-port: 7893
bind-address: "*"
mode: rule
log-level: silent
find-process-mode: strict
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://v6.gh-proxy.org/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages-no-fonts.zip"

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

tun:
  enable: true
  mtu: 9000
  device: mihomo
  stack: mips
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true

listeners:
  - name: ebpf-in
    type: ebpf
    local:
      enable: false
      ipv6: false
      bypass-private-address: false
    shared:
      enable: false
      interface:
        - wlan2
        - br-lan
        - br0
      ipv6: false
      bypass-private-address: false

dns:
  enable: true
  listen: 0.0.0.0:1053
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - rule-set:排除域名
    - rule-set:大陆域名
  nameserver-policy:
    rule-set:海外域名: 
      - https://8.8.8.8/dns-query
    rule-set:大陆域名:
      - https://223.5.5.5/dns-query
  nameserver:
    - https://1.1.1.1/dns-query
  proxy-server-nameserver:
    - https://1.12.12.12/dns-query#DNS出口
  direct-nameserver:
    - https://223.5.5.5/dns-query

hosts:
  # 将国内镜像域名 CNAME 到 googleapis.com，修复 Google Play 下载失败问题
  services.googleapis.cn: [services.googleapis.com]

proxies:
  - { name: DNS_Hijack, type: dns }
  - { name: 直连出口, type: direct }

代理合集: &providers { interval: 3600, proxy: 订阅更新, health-check: { enable: true, url: https://www.gstatic.com/generate_204, interval: 86400, timeout: 2000 } }
混淆覆写: &host { override-expr: ['.servername = "填免流混淆"', '.sni = .servername', '(select(.network == "ws") | .["ws-opts"].headers.Host) = .servername', '(select(.network == "http") | .["http-opts"].headers.Host) = [.servername]', '(select(.network == "h2") | .["h2-opts"].headers.Host) = [.servername]', '(select(.network == "xhttp") | .["xhttp-opts"].headers.Host) = .servername', '(select(.type == "cns") | .headers.Host) = .servername'] }
proxy-providers:
  百度直连:
    type: http
    <<: *providers
    url: "https://gist.githubusercontent.com/jieluojun/d4b528ee3418740112357a80e940d912/raw/BaiduDirect"
    override: { additional-prefix: "百度直连/" }
  钉钉直连:
    type: http
    <<: *providers
    url: "https://gist.githubusercontent.com/jieluojun/d4b528ee3418740112357a80e940d912/raw/DingTalkDirect"
    override: { additional-prefix: "钉钉直连/", override-expr: ['.path = "gw.alicdn.com"', '(select(.type == "http") | .path) = ("@" + .path)'] }
  CNS订阅:
    type: http
    <<: *providers
    url: "https://gist.githubusercontent.com/jieluojun/d4b528ee3418740112357a80e940d912/raw/cns"
    override: { additional-prefix: "CNS订阅/", <<: *host }
  免流订阅:
    type: http
    <<: *providers
    url: "https://gist.githubusercontent.com/jieluojun/d4b528ee3418740112357a80e940d912/raw/MLSub"
    override: { additional-prefix: "免流订阅/", <<: *host }
  免流节点:
    type: file
    <<: *providers
    path: ./proxies/免流节点.yaml
    override: { additional-prefix: "免流节点/", <<: *host }
  非免订阅:
    type: http
    <<: *providers
    url: "https://raw.githubusercontent.com/LancelotRar/free-subs/refs/heads/main/src/clash-lancelot.yaml"
    override: { additional-prefix: "非免订阅/", dialer-proxy: 链式代理 }
  非免节点:
    type: file
    <<: *providers
    path: ./proxies/非免节点.txt
    override: { additional-prefix: "非免节点/", dialer-proxy: 链式代理 }

proxy-groups:
  - name: 国外出口
    type: select
    exclude-filter: 中国|官网|剩余|到期|家宽|江苏|镇江|浙江|杭州|常州|南京|北京|上海|广东|广州|苏州|杭州|福州|扬州|贵州|兰州|徐州|郑州|广西|河南|河北|重庆|南宁|宿迁|沈阳|四川|安徽|深圳|辽宁|济南|九江|长沙|昆明|武汉|陕西|西宁|芜湖|天津|南昌|成都|山西|太原|保定|湖南|湖北|德阳|山东|十堰|青岛|合肥|云南|西安|内蒙古
    include-all-providers: true
  - name: 国内出口
    type: select
    proxies:
      - 百度直连
      - 钉钉直连
      - 国内节点
      - 直连出口
  - name: 百度直连
    type: select
    use:
      - 百度直连
  - name: 钉钉直连
    type: select
    use:
      - 钉钉直连
  - name: 游戏UDP
    type: select
    proxies:
      - 国内节点
      - 直连出口
    use:
      - CNS订阅
  - name: 全部UDP
    type: select
    proxies:
      - PASS
      - 国内节点
      - 直连出口
    use:
      - CNS订阅
  - name: 国内节点
    type: select
    use:
      - 免流订阅
      - 免流节点
      - 非免订阅
      - 非免节点
    filter: 中国|江苏|镇江|浙江|杭州|常州|南京|北京|上海|广东|广州|苏州|杭州|福州|扬州|贵州|兰州|徐州|郑州|广西|河南|河北|重庆|南宁|宿迁|沈阳|四川|安徽|深圳|辽宁|济南|九江|长沙|昆明|武汉|陕西|西宁|芜湖|天津|南昌|成都|山西|太原|保定|湖南|湖北|德阳|山东|十堰|青岛|合肥|云南|西安|内蒙古
  - name: 链式代理
    type: select
    use:
      - 免流订阅
    proxies:
      - 百度直连
      - 钉钉直连
  - name: 订阅更新
    type: select
    proxies:
      - 国外出口
      - 国内出口
      - 直连出口
  - name: DNS出口
    type: select
    proxies:
      - 百度直连
      - 钉钉直连
  - name: 广告出口
    type: select
    proxies:
      - PASS
      - REJECT

域名集: &domain { type: http, interval: 86400, proxy: 订阅更新, behavior: domain, format: mrs }
地址集: &ipcidr { type: http, interval: 86400, proxy: 订阅更新, behavior: ipcidr, format: mrs }

rule-providers:
  排除域名:
    <<: *domain 
    url: "https://v6.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/fakeip-filter.mrs"
  广告域名:
    <<: *domain
    url: "https://v6.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/ads.mrs"
  谷歌FCM:
    <<: *domain
    url: "https://v6.gh-proxy.org/https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/googlefcm.mrs"
  海外域名:
    <<: *domain
    url: "https://v6.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/proxy.mrs"
  大陆域名:
    <<: *domain
    url: "https://v6.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cn.mrs"
  本机地址:
    <<: *ipcidr
    url: "https://v6.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/privateip.mrs"
  大陆地址:
    <<: *ipcidr
    url: "https://v6.gh-proxy.org/https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/cnip.mrs"

rules:
  - DST-PORT,53,DNS_Hijack
  - AND,(NETWORK,UDP),(OR,(DST-PORT,443/3478/5349/19302),(RULE-SET,本机地址)),REJECT
  # 如果遇到某些软件出现跳点就取消下面注释(大概也许可能应该或许有.用)
  #  - DOMAIN-REGEX,(wswup.cdn.huya.com)|(cdnws.api.huya.com)|(p2p)|(stun)|(pcdn)|(mcdn)|(torrent)|(tracker)|(httpdns),REJECT-DROP
  - RULE-SET,广告域名,广告出口
  - RULE-SET,海外域名,国外出口 
  - AND,(NETWORK,UDP),(PROCESS-NAME-REGEX,(com.tencent.tmgp.sgame)|(com.tencent.tmgp.cf)),游戏UDP
  - NETWORK,UDP,全部UDP
  - RULE-SET,大陆域名,国内出口
  - RULE-SET,大陆地址,国内出口
  - RULE-SET,本机地址,直连出口
  - MATCH,国外出口
  - MATCH,REJECT