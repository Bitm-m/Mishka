name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/native/mishka_core/go.mod
          cache-dependency-path: app/src/main/native/mishka_core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Android signing key
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: echo ${{ secrets.SIGNING_KEY }} | base64 -d > keystore.jks

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug
          path: app/build/outputs/apk/debug/*.apk
          archive: false

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release
          path: app/build/outputs/apk/release/*.apk
          archive: false
