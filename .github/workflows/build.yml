name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare custom mihomo kernel
        run: |
          set -euo pipefail
          BASE_COMMIT="$(sed -n 's/^base_commit=//p' patches/mihomo/BASELINE.txt | head -1)"
          rm -rf mihomo
          git clone --single-branch --branch Alpha https://github.com/jieluojun/mihomo.git mihomo
          if [ -n "$BASE_COMMIT" ]; then
            if ! git -C mihomo cat-file -e "${BASE_COMMIT}^{commit}" 2>/dev/null; then
              git -C mihomo fetch --quiet origin "+${BASE_COMMIT}:refs/mishka-custom/base" || true
            fi
            if git -C mihomo cat-file -e "${BASE_COMMIT}^{commit}" 2>/dev/null; then
              git -C mihomo checkout -q "$BASE_COMMIT"
            fi
          fi
          for p in "$PWD"/patches/mihomo/[0-9]*.patch; do
            echo "Applying $(basename "$p") ..."
            git -C mihomo apply "$p" || git -C mihomo apply --3way "$p"
          done
          cat > go.work <<'EOF'
          go 1.25.0

          use (
          	./app/src/main/native/mishka_core
          	./mihomo
          )
          EOF
          sort -u app/src/main/native/mishka_core/go.sum mihomo/go.sum > go.work.sum
          git config submodule.mihomo.ignore all
          SHA="$(git -C mihomo rev-parse --short=8 HEAD)"
          echo "MIHOMO_VERSION=alpha-smart-${SHA}-zero" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/native/mishka_core/go.mod
          cache-dependency-path: app/src/main/native/mishka_core/go.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Android signing key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > keystore.jks
          fi

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Build Debug APK
        run: ./gradlew "-Pmihomo.version=${MIHOMO_VERSION}" :app:assembleDebug
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release APK
        run: ./gradlew "-Pmihomo.version=${MIHOMO_VERSION}" :app:assembleRelease
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/keystore.jks"
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Debug APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*-arm64-v8a-*.apk
          archive: false

      - name: Upload Debug APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-*.apk
          archive: false

      - name: Upload Debug APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-x86_64
          path: app/build/outputs/apk/debug/*-x86_64-*.apk
          archive: false

      - name: Upload Debug APK (x86)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-x86
          path: app/build/outputs/apk/debug/*-x86-*.apk
          archive: false

      - name: Upload Release APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-arm64-v8a
          path: app/build/outputs/apk/release/*-arm64-v8a-*.apk
          archive: false

      - name: Upload Release APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-armeabi-v7a
          path: app/build/outputs/apk/release/*-armeabi-v7a-*.apk
          archive: false

      - name: Upload Release APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-x86_64
          path: app/build/outputs/apk/release/*-x86_64-*.apk
          archive: false

      - name: Upload Release APK (x86)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-x86
          path: app/build/outputs/apk/release/*-x86-*.apk
          archive: false
