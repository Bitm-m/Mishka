name: Build

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: app/src/main/native/mishka_core/go.mod
          cache-dependency-path: |
            app/src/main/native/mishka_core/go.sum
            patches/mihomo/go.work.sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare custom mihomo kernel
        run: |
          set -euo pipefail
          rm -rf mihomo
          git clone --depth=1 --single-branch --branch Alpha https://github.com/jieluojun/mihomo.git mihomo
          for p in "$PWD"/patches/mihomo/[0-9]*.patch; do
            echo "Applying $(basename "$p") ..."
            git -C mihomo apply "$p" || git -C mihomo apply --3way "$p"
          done
          cat > go.work <<'EOF'
          go 1.25.0

          use (
          	./app/src/main/native/mishka_core
          	./mihomo
          )
          EOF
          cp patches/mihomo/go.work.sum go.work.sum
          {
            echo "/go.work"
            echo "/go.work.sum"
          } >> .git/info/exclude
          git config submodule.mihomo.ignore all
          SHA="$(git -C mihomo rev-parse --short=8 HEAD)"
          echo "MIHOMO_VERSION=alpha-smart-${SHA}-with-at" >> "$GITHUB_ENV"

      - name: Decode Android signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEY:-}" ]; then
            ks="$RUNNER_TEMP/release.jks"
            printf '%s' "$SIGNING_KEY" | base64 -d > "$ks"
            {
              echo "KEYSTORE_PATH=$ks"
              echo "KEYSTORE_PASS=$KEY_STORE_PASSWORD"
              echo "KEY_ALIAS=${ALIAS:-mishka}"
              echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEY_STORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          elif [ -n "${KEYSTORE_BASE64:-}" ]; then
            ks="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
            {
              echo "KEYSTORE_PATH=$ks"
              echo "KEYSTORE_PASS=$KEYSTORE_PASS"
              echo "KEY_ALIAS=${KEY_ALIAS:-mishka}"
              echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASS}"
            } >> "$GITHUB_ENV"
          else
            ks="$RUNNER_TEMP/debug-key.jks"
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null
            {
              echo "KEYSTORE_PATH=$ks"
              echo "KEYSTORE_PASS=android"
              echo "KEY_ALIAS=androiddebugkey"
              echo "KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi

      - name: Download GeoIP files
        run: ./gradlew :app:downloadGeoFiles

      - name: Build Debug APK
        run: ./gradlew "-Pmihomo.version=${MIHOMO_VERSION}" :app:assembleDebug

      - name: Build Release APK
        run: ./gradlew "-Pmihomo.version=${MIHOMO_VERSION}" :app:assembleRelease

      - name: Upload Debug APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*-arm64-v8a-*.apk
          archive: false

      - name: Upload Debug APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*-armeabi-v7a-*.apk
          archive: false

      - name: Upload Debug APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-x86_64
          path: app/build/outputs/apk/debug/*-x86_64-*.apk
          archive: false

      - name: Upload Debug APK (x86)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-debug-x86
          path: app/build/outputs/apk/debug/*-x86-*.apk
          archive: false

      - name: Upload Release APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-arm64-v8a
          path: app/build/outputs/apk/release/*-arm64-v8a-*.apk
          archive: false

      - name: Upload Release APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-armeabi-v7a
          path: app/build/outputs/apk/release/*-armeabi-v7a-*.apk
          archive: false

      - name: Upload Release APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-x86_64
          path: app/build/outputs/apk/release/*-x86_64-*.apk
          archive: false

      - name: Upload Release APK (x86)
        uses: actions/upload-artifact@v7
        with:
          name: Mishka-release-x86
          path: app/build/outputs/apk/release/*-x86-*.apk
          archive: false
